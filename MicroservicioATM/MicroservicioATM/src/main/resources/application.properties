server.port=8080

# Usuario principal con todas los permisos
nombre.usuario.administrador=administrador
codigo.usuario.administrador=0

# Usuario cliente del cajero
nombre.usuario.cliente.cajero=clienteUsuario
codigo.usuario.cliente.cajero=10000

# Path local de inicio del WS
url.base.ws=http://localhost:8080/atm/


# Configuración de la base de datos H2 en memoria
spring.datasource.url=jdbc:h2:mem:atm
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=sa

# Dialecto de Hibernate para H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Crear y actualizar automáticamente las tablas
spring.jpa.hibernate.ddl-auto=update

# Habilitar consola web de H2
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console